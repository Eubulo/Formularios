<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1f3a">
<meta name="description" content="Guia oficial DAC de positivação qualitativa por indústria, família e item">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DAC | Positivação Qualitativa</title>
<style>
:root{--n:#0b1f3a;--b:#2563eb;--bg:#f4f7fb;--tx:#17263b;--mut:#64748b;--ln:#dbe4ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}.hide{display:none!important}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--n);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--n);border:1px solid #cbd5e1}
.top{height:64px;background:var(--n);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{display:flex;gap:10px;align-items:center}.mark{width:39px;height:39px;border-radius:11px;background:#fff;color:var(--n);display:grid;place-items:center;font-weight:950;font-size:14px}.brand b{font-size:15px}
.user{font-size:12px;color:#c9d7e7;text-align:right}
.shell{width:min(1180px,calc(100% - 24px));margin:22px auto 55px}
.hero{background:linear-gradient(135deg,#0b1f3a,#173e6c);color:#fff;border-radius:19px;padding:21px 22px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.hero h1{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:#c9d7e7}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{min-width:90px;background:#ffffff12;border:1px solid #ffffff1f;border-radius:12px;padding:8px 10px}.stat b{font-size:19px;display:block}.stat span{font-size:10px;color:#c7d4e6;text-transform:uppercase}
.toolbar{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}.search,.filter{background:#fff;border:1px solid #cbd5e1;border-radius:11px;padding:11px 12px;outline:none}.search{flex:1;min-width:240px}.filter{min-width:160px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--ln);border-radius:18px;box-shadow:0 8px 26px #0f1f3710}
.ind{padding:16px;cursor:pointer;transition:.15s}.ind:hover{transform:translateY(-2px);border-color:#aac3df}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;border-radius:999px;background:#eaf0f7;color:#324d69;padding:5px 8px;font-size:10px;font-weight:850}.badge.rv{background:#fff2cf;color:#8a5200}.badge.photo{background:#e5f7ed;color:#176339}.badge.nophoto{background:#eef2f6;color:#64748b}
.ind h3{margin:12px 0 5px}.mut{color:var(--mut);font-size:12px}.foot{display:flex;justify-content:space-between;margin-top:14px;color:var(--mut);font-size:12px}
.back{margin-bottom:12px}.rule{background:#eff6ff;border:1px solid #c8daf1;border-radius:15px;padding:15px;margin:13px 0}.rule h3{margin:0 0 5px;color:#123d75}.rule p{margin:0;color:#38516e;line-height:1.5}.rulebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.families{display:grid;gap:9px}.fam{overflow:hidden}.famhead{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.famhead:hover{background:#fafcff}.famname{font-weight:850}
.items{padding:0 13px 13px;border-top:1px solid #edf1f5}.itemgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-top:11px}
.item{background:#fbfcfe;border:1px solid #e3e9f0;border-radius:11px;padding:11px;cursor:pointer;transition:.15s}.item:hover{background:#fff;border-color:#aac3df;transform:translateY(-1px)}.item b{font-size:13px;line-height:1.35}.codes{font-size:11px;color:#738297;margin-top:4px}.itemfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}.tap{font-size:10px;color:#62768e;font-weight:800}
.empty{padding:32px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:15px;color:var(--mut)}.loading{padding:45px;text-align:center;color:var(--mut)}
.modal{position:fixed;inset:0;background:#07182dcc;display:grid;place-items:center;padding:18px;z-index:100}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 80px #0005}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #e6edf5;position:sticky;top:0;background:#fff;z-index:2}.close{width:38px;height:38px;border:0;border-radius:10px;background:#eef3f8;color:#263b51;font-size:21px;cursor:pointer}.modalbody{display:grid;grid-template-columns:minmax(250px,42%) 1fr;gap:22px;padding:20px}.photoarea{min-height:330px;border:1px solid #e3e9f0;border-radius:15px;background:#f8fafc;display:grid;place-items:center;padding:14px;overflow:hidden}.productimg{display:block;max-width:100%;max-height:430px;object-fit:contain;border-radius:10px}.nophoto{display:grid;place-items:center;text-align:center;color:#708197;padding:30px;min-height:250px}.nophoto strong{display:block;color:#42566d;margin-bottom:5px}.detail h2{margin:9px 0 12px;font-size:21px;line-height:1.25}.detailrow{padding:10px 0;border-bottom:1px solid #edf1f5}.detailrow span{display:block;color:#7a899c;font-size:10px;text-transform:uppercase;font-weight:850;letter-spacing:.04em;margin-bottom:3px}.detailrow b{font-size:13px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.itemgrid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.modalbody{grid-template-columns:1fr}.photoarea{min-height:260px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.shell{width:calc(100% - 16px);margin-top:14px}.top{padding:0 10px}.user{display:none}.hero{padding:17px}.hero h1{font-size:22px}.toolbar{display:grid}.filter{width:100%}.modal{padding:8px}.modalbox{max-height:96vh;border-radius:16px}.modalbody{padding:14px;gap:14px}.photoarea{min-height:230px}.detail h2{font-size:18px}}
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando…</div></div>
<div id="modalRoot"></div>
<script>
(()=>{
'use strict';
const SB='https://vplztpuvwjwufylaxbgu.supabase.co';
const KEY='sb_publishable_wlOvfSrtIgpUmr_TpVYzCA_SlgUpzTg';
const app=document.getElementById('app');
const modalRoot=document.getElementById('modalRoot');
let S={inds:[],fams:[],rules:[],rf:[],prods:[],q:'',folder:''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path){
  const r=await fetch(SB+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  if(!r.ok){
    let m='Erro '+r.status;
    try{const x=await r.json();m=x.message||x.hint||x.error||m}catch{}
    throw Error(m);
  }
  return r.json();
}

async function load(){
  app.innerHTML='<div class="loading">Carregando catálogo DAC…</div>';
  try{
    const[i,f,r,rf,pr]=await Promise.all([
      api('/rest/v1/industries?active=eq.true&select=*&order=name.asc'),
      api('/rest/v1/families?active=eq.true&select=*&order=name.asc'),
      api('/rest/v1/positivity_rules?active=eq.true&select=*&order=start_date.desc'),
      api('/rest/v1/rule_families?select=*&order=display_order.asc'),
      api('/rest/v1/products?active=eq.true&select=id,industry_code,family_id,brand,dac_code,description,ean,image_url&order=description.asc')
    ]);
    S.inds=i||[];S.fams=f||[];S.rules=r||[];S.rf=rf||[];S.prods=pr||[];
    home();
  }catch(x){
    app.innerHTML=`<div class="empty" style="margin:35px">Não foi possível carregar o catálogo.<br>${esc(x.message)}<br><br><button class="btn" onclick="location.reload()">Tentar novamente</button></div>`;
  }
}

function top(){
  return `<header class="top"><div class="brand"><div class="mark">DAC</div><div><b>Positivação Qualitativa</b><div class="mut" style="color:#c9d7e7">Guia oficial de famílias e itens</div></div></div><div class="user">Acesso público<br>Somente leitura</div></header>`;
}

function home(){
  const folders=[...new Set(S.inds.map(x=>x.folder).filter(Boolean))].sort();
  const qt=S.q.trim().toLowerCase();
  const matching=new Set();
  if(qt){
    S.inds.forEach(x=>{if(`${x.name} ${x.code} ${x.folder||''}`.toLowerCase().includes(qt))matching.add(String(x.code))});
    S.prods.forEach(p=>{if(`${p.description} ${p.brand||''} ${p.dac_code} ${p.ean}`.toLowerCase().includes(qt))matching.add(String(p.industry_code))});
    S.fams.forEach(f=>{if(String(f.name).toLowerCase().includes(qt))matching.add(String(f.industry_code))});
  }
  const list=S.inds.filter(x=>(!S.folder||x.folder===S.folder)&&(!qt||matching.has(String(x.code))));
  app.innerHTML=top()+`<main class="shell"><section class="hero"><div><h1>Guia oficial de positivação</h1><p>Consulte regra, famílias e itens válidos de cada indústria — sem login.</p></div><div class="stats"><div class="stat"><b>${S.inds.length}</b><span>indústrias</span></div><div class="stat"><b>${S.fams.length}</b><span>famílias</span></div><div class="stat"><b>${S.prods.length}</b><span>itens</span></div></div></section><div class="toolbar"><input id="search" class="search" placeholder="Buscar indústria, família, item, código DAC ou EAN" value="${esc(S.q)}"><select id="folder" class="filter"><option value="">Todas as pastas</option>${folders.map(f=>`<option ${S.folder===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div>${list.length?`<div class="grid">${list.map(x=>{const fc=S.fams.filter(f=>String(f.industry_code)===String(x.code)).length,pc=S.prods.filter(p=>String(p.industry_code)===String(x.code)).length;return `<article class="card ind" data-i="${esc(x.code)}"><div class="badges"><span class="badge">${esc(x.folder||'Sem pasta')}</span><span class="badge rv">Peso RV ${esc(x.rv_weight)}</span></div><h3>${esc(x.name)}</h3><div class="mut">Código ${esc(x.code)}</div><div class="foot"><span>${fc} famílias · ${pc} itens</span><span>Abrir →</span></div></article>`}).join('')}</div>`:'<div class="empty">Nenhum resultado encontrado.</div>'}</main>`;
  const search=document.getElementById('search'),folder=document.getElementById('folder');
  search.oninput=e=>{S.q=e.target.value;home()};
  folder.onchange=e=>{S.folder=e.target.value;home()};
  document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>industry(x.dataset.i));
}

function industry(code){
  const ind=S.inds.find(x=>String(x.code)===String(code));
  const rule=S.rules.find(x=>String(x.industry_code)===String(code));
  const rfs=rule?S.rf.filter(x=>String(x.rule_id)===String(rule.id)&&x.participates!==false):[];
  let fams=S.fams.filter(x=>String(x.industry_code)===String(code));
  if(rfs.length){
    const ids=new Set(rfs.map(x=>String(x.family_id)));
    fams=fams.filter(x=>ids.has(String(x.id))).sort((a,b)=>(rfs.find(x=>String(x.family_id)===String(a.id))?.display_order??999)-(rfs.find(x=>String(x.family_id)===String(b.id))?.display_order??999));
  }
  const prods=S.prods.filter(x=>String(x.industry_code)===String(code));
  app.innerHTML=top()+`<main class="shell"><button id="back" class="btn alt back">← Voltar</button><section class="hero"><div><div class="badges"><span class="badge">${esc(ind.folder||'Sem pasta')}</span><span class="badge rv">Peso RV ${esc(ind.rv_weight)}</span></div><h1 style="margin-top:10px">${esc(ind.name)}</h1><p>Código ${esc(ind.code)} · ${fams.length} famílias · ${prods.length} itens válidos</p></div></section>${rule?`<section class="rule"><h3>${esc(rule.name)}</h3><p>${esc(rule.seller_text)}</p><div class="rulebar"><div class="badges"><span class="badge">${esc(rule.rule_type)}</span><span class="badge rv">Mínimo ${esc(rule.minimum_families)} famílias</span></div></div></section>`:''}<section class="families">${fams.map(f=>{const ps=prods.filter(p=>String(p.family_id)===String(f.id)),rf=rfs.find(x=>String(x.family_id)===String(f.id));return `<article class="card fam"><div class="famhead" data-f="${esc(f.id)}"><div><span class="famname">${esc(f.name)}</span> <span class="mut">${ps.length} itens</span>${rf?.required?' <span class="badge rv">Obrigatória</span>':''}</div><span>▼</span></div><div id="fam-${esc(f.id)}" class="items hide"><div class="itemgrid">${ps.map(p=>`<div class="item" data-p="${esc(p.id)}"><b>${esc(p.description)}</b><div class="codes">Marca: ${esc(p.brand||'—')} · DAC ${esc(p.dac_code)} · EAN ${esc(p.ean)}</div><div class="itemfoot"><span class="badge ${p.image_url?'photo':'nophoto'}">${p.image_url?'Foto disponível':'Sem foto'}</span><span class="tap">Ver produto →</span></div></div>`).join('')}</div></div></article>`}).join('')}</section></main>`;
  document.getElementById('back').onclick=home;
  document.querySelectorAll('[data-f]').forEach(h=>h.onclick=()=>{const b=document.getElementById('fam-'+h.dataset.f);b.classList.toggle('hide');h.lastElementChild.textContent=b.classList.contains('hide')?'▼':'▲'});
  document.querySelectorAll('[data-p]').forEach(el=>el.onclick=e=>{e.stopPropagation();showProduct(el.dataset.p)});
  window.scrollTo({top:0,behavior:'smooth'});
}

function showProduct(id){
  const p=S.prods.find(x=>String(x.id)===String(id));
  if(!p)return;
  const photo=p.image_url?`<div class="photoarea"><img id="productImage" class="productimg" src="${esc(p.image_url)}" alt="${esc(p.description)}"></div>`:`<div class="photoarea"><div class="nophoto"><div><strong>Foto não disponível</strong>Este produto ainda não possui foto cadastrada.</div></div></div>`;
  modalRoot.innerHTML=`<div class="modal" id="productModal"><div class="modalbox"><div class="modalhead"><b>Detalhe do produto</b><button class="close" id="modalClose" aria-label="Fechar">×</button></div><div class="modalbody">${photo}<div class="detail"><div class="badges"><span class="badge ${p.image_url?'photo':'nophoto'}">${p.image_url?'Foto cadastrada':'Sem foto'}</span></div><h2>${esc(p.description)}</h2><div class="detailrow"><span>Marca</span><b>${esc(p.brand||'—')}</b></div><div class="detailrow"><span>Código DAC</span><b>${esc(p.dac_code)}</b></div><div class="detailrow"><span>EAN</span><b>${esc(p.ean)}</b></div></div></div></div></div>`;
  const modal=document.getElementById('productModal');
  const close=()=>{modalRoot.innerHTML='';document.removeEventListener('keydown',keyClose)};
  const keyClose=e=>{if(e.key==='Escape')close()};
  document.getElementById('modalClose').onclick=close;
  modal.onclick=e=>{if(e.target===modal)close()};
  document.addEventListener('keydown',keyClose);
  const img=document.getElementById('productImage');
  if(img)img.onerror=()=>{img.parentElement.innerHTML='<div class="nophoto"><div><strong>Foto não disponível</strong>A imagem cadastrada não pôde ser carregada.</div></div>'};
}

load();
})();
</script>
</body>
</html>
