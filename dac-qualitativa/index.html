<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f3a"><title>DAC | Positivação Qualitativa</title><style>
:root{--n:#0b1f3a;--b:#2563eb;--bg:#f4f7fb;--tx:#17263b;--mut:#64748b;--ln:#dbe4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--n);color:white}.btn.alt{background:white;color:var(--n);border:1px solid #cbd5e1}.btn.blue{background:var(--b)}.btn:disabled{opacity:.55}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.intro{background:linear-gradient(145deg,#07182d,#174270);color:white;padding:52px;display:flex;align-items:flex-end}.intro h1{font-size:42px;line-height:1.03;margin:16px 0}.intro p{color:#c8d7e8;max-width:560px;line-height:1.55}.mark{width:58px;height:58px;border-radius:16px;background:white;color:var(--n);display:grid;place-items:center;font-weight:950}.points{display:grid;gap:9px;margin-top:24px;color:#d9e5f2;font-size:13px}.side{display:grid;place-items:center;padding:24px}.card{background:white;border:1px solid var(--ln);border-radius:18px;box-shadow:0 8px 26px #0f1f3710}.auth{width:min(430px,100%);padding:27px}.auth h2{margin:0 0 7px}.auth p{color:var(--mut);line-height:1.45}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800}.field input{padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;outline:none}.field input:focus,.search:focus,.filter:focus{border-color:#7da8e8;box-shadow:0 0 0 3px #2563eb12}.actions{display:flex;gap:8px;margin-top:16px}.actions .btn{flex:1}.msg{padding:10px 11px;border-radius:9px;font-size:12px;margin:10px 0}.err{background:#fef2f2;color:#991b1b}.ok{background:#f0fdf4;color:#166534}.top{height:64px;background:var(--n);color:white;display:flex;justify-content:space-between;align-items:center;padding:0 18px;position:sticky;top:0;z-index:20}.brand{display:flex;gap:10px;align-items:center}.brand .mark{width:39px;height:39px;border-radius:11px;font-size:14px}.brand b{font-size:15px}.user{font-size:12px;color:#c9d7e7;text-align:right}.shell{width:min(1180px,calc(100% - 24px));margin:22px auto 55px}.hero{background:linear-gradient(135deg,#0b1f3a,#173e6c);color:white;border-radius:19px;padding:21px 22px;display:flex;justify-content:space-between;align-items:center;gap:18px}.hero h1{margin:0 0 5px;font-size:25px}.hero p{margin:0;color:#c9d7e7}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{min-width:90px;background:#ffffff12;border:1px solid #ffffff1f;border-radius:12px;padding:8px 10px}.stat b{font-size:19px;display:block}.stat span{font-size:10px;color:#c7d4e6;text-transform:uppercase}.toolbar{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}.search,.filter{background:white;border:1px solid #cbd5e1;border-radius:11px;padding:11px 12px;outline:none}.search{flex:1;min-width:240px}.filter{min-width:160px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.ind{padding:16px;cursor:pointer;transition:.15s}.ind:hover{transform:translateY(-2px);border-color:#aac3df}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;border-radius:999px;background:#eaf0f7;color:#324d69;padding:5px 8px;font-size:10px;font-weight:850}.badge.rv{background:#fff2cf;color:#8a5200}.badge.good{background:#e5f7ed;color:#176339}.ind h3{margin:12px 0 5px}.mut{color:var(--mut);font-size:12px}.foot{display:flex;justify-content:space-between;margin-top:14px;color:var(--mut);font-size:12px}.back{margin-bottom:12px}.rule{background:#eff6ff;border:1px solid #c8daf1;border-radius:15px;padding:15px;margin:13px 0}.rule h3{margin:0 0 5px;color:#123d75}.rule p{margin:0;color:#38516e;line-height:1.5}.rulebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.families{display:grid;gap:9px}.fam{overflow:hidden}.famhead{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.famhead:hover{background:#fafcff}.famname{font-weight:850}.items{padding:0 13px 13px;border-top:1px solid #edf1f5}.itemgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-top:11px}.item{background:#fbfcfe;border:1px solid #e3e9f0;border-radius:11px;padding:10px 11px}.item b{font-size:13px;line-height:1.35}.codes{font-size:11px;color:#738297;margin-top:4px}.empty{padding:32px;text-align:center;background:white;border:1px dashed #cbd5e1;border-radius:15px;color:var(--mut)}.loading{padding:45px;text-align:center;color:var(--mut)}@media(max-width:820px){.login{grid-template-columns:1fr}.intro{display:none}.grid{grid-template-columns:repeat(2,1fr)}.itemgrid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.grid{grid-template-columns:1fr}.shell{width:calc(100% - 16px);margin-top:14px}.top{padding:0 10px}.user{display:none}.hero{padding:17px}.hero h1{font-size:22px}.toolbar{display:grid}.filter{width:100%}.actions{flex-direction:column}.auth{padding:21px}}
</style></head><body><div id="app"><div class="loading">Carregando…</div></div><script>
(()=>{'use strict';const SB='https://vplztpuvwjwufylaxbgu.supabase.co',KEY='sb_publishable_wlOvfSrtIgpUmr_TpVYzCA_SlgUpzTg',app=document.getElementById('app');let S={token:'',refresh:'',user:null,profile:null,inds:[],fams:[],rules:[],rf:[],prods:[],acks:[],q:'',folder:''};const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function store(d){S.token=d?.access_token||'';S.refresh=d?.refresh_token||'';S.user=d?.user||null;if(d){localStorage.setItem('dac_session',JSON.stringify({token:S.token,refresh:S.refresh,user:S.user}))}else localStorage.removeItem('dac_session')}function restore(){try{const x=JSON.parse(localStorage.getItem('dac_session'));if(x?.token&&x?.user){S.token=x.token;S.refresh=x.refresh;S.user=x.user;return true}}catch{}return false}async function refresh(){if(!S.refresh)return false;const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refresh})});if(!r.ok)return false;store(await r.json());return true}async function api(path,opt={},retry=true){const h={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(S.token)h.Authorization='Bearer '+S.token;const r=await fetch(SB+path,{...opt,headers:h});if(r.status===401&&retry&&await refresh())return api(path,opt,false);if(!r.ok){let m='Erro '+r.status;try{const x=await r.json();m=x.message||x.msg||x.error||m}catch{}throw Error(m)}if(r.status===204)return null;const t=await r.text();return t?JSON.parse(t):null}function login(){app.innerHTML=`<div class="login"><section class="intro"><div><div class="mark">DAC</div><h1>Positivação<br>Qualitativa</h1><p>O guia oficial para o time saber exatamente quais famílias e itens fazem parte da positivação de cada indústria.</p><div class="points"><span>✓ Regra por indústria</span><span>✓ Famílias e itens válidos</span><span>✓ Código DAC e EAN para conferência</span></div></div></section><section class="side"><div class="card auth"><h2>Acesse a plataforma</h2><p>Use seu e-mail e senha. No primeiro acesso, crie sua conta.</p><div id="msg"></div><div class="field"><label>Nome</label><input id="name" placeholder="Seu nome"></div><div class="field"><label>E-mail</label><input id="email" type="email" placeholder="seuemail@empresa.com"></div><div class="field"><label>Senha</label><input id="pass" type="password" placeholder="Mínimo 6 caracteres"></div><div class="actions"><button id="in" class="btn blue">Entrar</button><button id="up" class="btn alt">Criar acesso</button></div></div></section></div>`;const msg=(t,c='err')=>document.getElementById('msg').innerHTML=`<div class="msg ${c}">${e(t)}</div>`;const nameInput=document.getElementById('name'),emailInput=document.getElementById('email'),passInput=document.getElementById('pass'),loginBtn=document.getElementById('in'),signupBtn=document.getElementById('up');loginBtn.onclick=async()=>{const em=emailInput.value.trim(),p=passInput.value;if(!em||!p)return msg('Informe e-mail e senha.');loginBtn.disabled=true;try{const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:p})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.message||'Falha no login');store(d);await load()}catch(x){msg(x.message)}finally{loginBtn.disabled=false}};signupBtn.onclick=async()=>{const em=emailInput.value.trim(),p=passInput.value,n=nameInput.value.trim();if(!em||!p)return msg('Informe e-mail e senha.');if(p.length<6)return msg('A senha deve ter ao menos 6 caracteres.');signupBtn.disabled=true;try{const r=await fetch(SB+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:p,data:{full_name:n||em.split('@')[0]}})}),d=await r.json();if(!r.ok)throw Error(d.msg||d.message||'Falha no cadastro');if(d.access_token){store(d);await load()}else msg('Conta criada. Confirme o e-mail se solicitado e depois entre.','ok')}catch(x){msg(x.message)}finally{signupBtn.disabled=false}}}async function load(){app.innerHTML='<div class="loading">Preparando o catálogo…</div>';try{const uid=S.user.id,[p,i,f,r,rf,pr,a]=await Promise.all([api(`/rest/v1/profiles?id=eq.${uid}&select=*`),api('/rest/v1/industries?active=eq.true&select=*&order=name.asc'),api('/rest/v1/families?active=eq.true&select=*&order=name.asc'),api('/rest/v1/positivity_rules?active=eq.true&select=*&order=start_date.desc'),api('/rest/v1/rule_families?select=*&order=display_order.asc'),api('/rest/v1/products?active=eq.true&select=id,industry_code,family_id,brand,dac_code,description,ean&order=description.asc'),api(`/rest/v1/rule_acknowledgements?user_id=eq.${uid}&select=rule_id,acknowledged_at`)]);S.profile=p?.[0]||{full_name:S.user.email,role:'seller'};S.inds=i||[];S.fams=f||[];S.rules=r||[];S.rf=rf||[];S.prods=pr||[];S.acks=a||[];home()}catch(x){app.innerHTML=`<div class="empty" style="margin:35px">Não foi possível carregar a plataforma.<br>${e(x.message)}<br><br><button class="btn" onclick="location.reload()">Tentar novamente</button></div>`}}function top(){return `<header class="top"><div class="brand"><div class="mark">DAC</div><div><b>Positivação Qualitativa</b><div class="mut" style="color:#c9d7e7">Guia oficial de famílias e itens</div></div></div><div style="display:flex;gap:10px;align-items:center"><div class="user">${e(S.profile?.full_name||'Usuário')}<br>${e(S.profile?.role||'seller')}</div><button id="out" class="btn alt">Sair</button></div></header>`}function bindOut(){document.getElementById('out').onclick=()=>{store(null);login()}}function home(){const folders=[...new Set(S.inds.map(x=>x.folder).filter(Boolean))].sort(),qt=S.q.toLowerCase(),list=S.inds.filter(x=>(!S.folder||x.folder===S.folder)&&(!qt||(`${x.name} ${x.code} ${x.folder||''}`).toLowerCase().includes(qt)));app.innerHTML=top()+`<main class="shell"><section class="hero"><div><h1>Guia oficial de positivação</h1><p>Escolha uma indústria para consultar regra, famílias e itens.</p></div><div class="stats"><div class="stat"><b>${S.inds.length}</b><span>indústrias</span></div><div class="stat"><b>${S.fams.length}</b><span>famílias</span></div><div class="stat"><b>${S.prods.length}</b><span>itens</span></div></div></section><div class="toolbar"><input id="search" class="search" placeholder="Buscar indústria, código ou pasta" value="${e(S.q)}"><select id="folder" class="filter"><option value="">Todas as pastas</option>${folders.map(f=>`<option ${S.folder===f?'selected':''}>${e(f)}</option>`).join('')}</select></div>${list.length?`<div class="grid">${list.map(x=>{const fc=S.fams.filter(f=>f.industry_code===x.code).length,pc=S.prods.filter(p=>p.industry_code===x.code).length;return `<article class="card ind" data-i="${e(x.code)}"><div class="badges"><span class="badge">${e(x.folder||'Sem pasta')}</span><span class="badge rv">Peso RV ${e(x.rv_weight)}</span></div><h3>${e(x.name)}</h3><div class="mut">Código ${e(x.code)}</div><div class="foot"><span>${fc} famílias · ${pc} itens</span><span>Abrir →</span></div></article>`}).join('')}</div>`:'<div class="empty">Nenhuma indústria encontrada.</div>'}</main>`;bindOut();const searchInput=document.getElementById('search'),folderSelect=document.getElementById('folder');searchInput.oninput=x=>{S.q=x.target.value;home()};folderSelect.onchange=x=>{S.folder=x.target.value;home()};document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>industry(x.dataset.i))}function model(code){const ind=S.inds.find(x=>String(x.code)===String(code)),rule=S.rules.find(x=>String(x.industry_code)===String(code)),rf=rule?S.rf.filter(x=>x.rule_id===rule.id&&x.participates!==false):[];let fam=S.fams.filter(x=>String(x.industry_code)===String(code));if(rf.length){const ids=new Set(rf.map(x=>x.family_id));fam=fam.filter(x=>ids.has(x.id)).sort((a,b)=>(rf.find(x=>x.family_id===a.id)?.display_order??999)-(rf.find(x=>x.family_id===b.id)?.display_order??999))}return{ind,rule,rf,fam,pr:S.prods.filter(x=>String(x.industry_code)===String(code))}}function industry(code){const M=model(code),ack=M.rule&&S.acks.some(x=>x.rule_id===M.rule.id);app.innerHTML=top()+`<main class="shell"><button class="btn alt back" id="back">← Indústrias</button><section class="hero"><div><div class="badges"><span class="badge">${e(M.ind.folder||'Sem pasta')}</span><span class="badge rv">Peso RV ${e(M.ind.rv_weight)}</span></div><h1 style="margin-top:10px">${e(M.ind.name)}</h1><p>Código ${e(M.ind.code)}</p></div><div class="stats"><div class="stat"><b>${M.fam.length}</b><span>famílias</span></div><div class="stat"><b>${M.pr.length}</b><span>itens</span></div></div></section>${M.rule?`<section class="rule"><h3>${e(M.rule.name)}</h3><p>${e(M.rule.seller_text)}</p><div class="rulebar"><div class="badges"><span class="badge">${e(M.rule.rule_type)}</span><span class="badge rv">Mínimo ${e(M.rule.minimum_families)} famílias</span>${ack?'<span class="badge good">✓ Ciência registrada</span>':''}</div><button class="btn blue" id="ack" ${ack?'disabled':''}>${ack?'✓ Ciente':'Li e estou ciente'}</button></div></section>`:''}<h2 style="font-size:20px">Famílias e itens</h2><div class="families">${M.fam.map(f=>{const ps=M.pr.filter(p=>p.family_id===f.id),map=M.rf.find(x=>x.family_id===f.id);return `<section class="card fam"><div class="famhead" data-f="${f.id}"><div><div class="famname">${e(f.name)} ${map?.required?'<span class="badge rv">Obrigatória</span>':''}</div><div class="mut">${ps.length} itens válidos</div></div><b>⌄</b></div><div class="items hide" id="f-${f.id}"><div class="itemgrid">${ps.map(p=>`<div class="item"><b>${e(p.description)}</b><div class="codes">DAC ${e(p.dac_code)} · EAN ${e(p.ean)}</div></div>`).join('')}</div></div></section>`}).join('')}</div></main>`;bindOut();document.getElementById('back').onclick=home;document.querySelectorAll('[data-f]').forEach(h=>h.onclick=()=>document.getElementById('f-'+h.dataset.f).classList.toggle('hide'));document.getElementById('ack')?.addEventListener('click',async()=>{try{await api('/rest/v1/rule_acknowledgements',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:S.user.id,rule_id:M.rule.id})});S.acks.push({rule_id:M.rule.id});industry(code)}catch(x){alert(x.message)}})}restore()?load():login()})();
</script></body></html>
