<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAC | Positivação Qualitativa</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#10233f;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.hidden{display:none}.top{background:#0b1f3a;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}.logo{font-weight:900;background:#fff;color:#0b1f3a;border-radius:10px;padding:9px 11px}.wrap{width:min(1100px,calc(100% - 24px));margin:22px auto}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:16px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%);padding:26px}.field{display:grid;gap:6px;margin:13px 0}.field input{padding:12px;border:1px solid #cbd5e1;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#0b1f3a;color:#fff;font-weight:800;cursor:pointer}.btn.sec{background:#fff;color:#0b1f3a;border:1px solid #cbd5e1}.actions{display:flex;gap:8px}.actions .btn{flex:1}.hero{background:#0b1f3a;color:#fff;border-radius:18px;padding:20px;margin-bottom:16px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#cbd5e1}.toolbar{display:flex;gap:8px;margin:14px 0}.toolbar input,.toolbar select{padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.industry{cursor:pointer}.industry h3{margin:10px 0 5px}.pill{display:inline-flex;background:#e8eef6;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.rv{background:#fff2cc;color:#7c4a00}.rule{background:#eef5ff;border:1px solid #c7dcff;border-radius:15px;padding:15px;margin:14px 0}.family{margin:10px 0}.family-head{display:flex;justify-content:space-between;cursor:pointer}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.product{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px}.muted{color:#64748b}.msg{padding:10px;border-radius:10px;margin:10px 0}.err{background:#fef2f2;color:#991b1b}.ok{background:#f0fdf4;color:#166534}@media(max-width:780px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid,.products{grid-template-columns:1fr}.toolbar{flex-direction:column}}</style></head><body><div id="app"></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.110.9';const db=createClient('https://vplztpuvwjwufylaxbgu.supabase.co','sb_publishable_wlOvfSrtIgpUmr_TpVYzCA_SlgUpzTg',{auth:{persistSession:true,autoRefreshToken:true}}),app=document.getElementById('app');let session,profile,industries=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const top=()=>`<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="logo">DAC</div><b>Positivação Qualitativa</b></div><button id="out" class="btn sec">Sair</button></div>`;function login(){app.innerHTML=`<div class="login"><div class="card"><div class="logo" style="display:inline-block">DAC</div><h2>Positivação Qualitativa</h2><p class="muted">Consulte as indústrias, regras, famílias e itens válidos.</p><div id="m"></div><div class="field"><label>Nome (primeiro acesso)</label><input id="n"></div><div class="field"><label>E-mail</label><input id="e" type="email"></div><div class="field"><label>Senha</label><input id="p" type="password"></div><div class="actions"><button id="in" class="btn">Entrar</button><button id="up" class="btn sec">Criar acesso</button></div></div></div>`;const msg=t=>m.innerHTML=`<div class="msg err">${esc(t)}</div>`;in.onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:e.value,password:p.value});if(error)msg(error.message)};up.onclick=async()=>{const{data,error}=await db.auth.signUp({email:e.value,password:p.value,options:{data:{full_name:n.value||e.value.split('@')[0]}}});if(error)msg(error.message);else if(!data.session)m.innerHTML='<div class="msg ok">Cadastro criado. Confirme o e-mail, caso seja solicitado.</div>'}};async function boot(){if(!session)return login();app.innerHTML='<div class="wrap">Carregando…</div>';const[{data:p},{data:i}]=await Promise.all([db.from('profiles').select('*').eq('id',session.user.id).single(),db.from('industries').select('*').eq('active',true).order('name')]);profile=p;industries=i||[];home()}function home(){const pastas=[...new Set(industries.map(x=>x.folder).filter(Boolean))].sort();app.innerHTML=top()+`<div class="wrap"><div class="hero"><h2>Guia oficial de positivação</h2><p>Escolha uma indústria para ver a regra, as famílias e todos os itens válidos.</p></div><div class="toolbar"><input id="q" placeholder="Buscar indústria, código ou pasta"><select id="f"><option value="">Todas as pastas</option>${pastas.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="g" class="grid"></div></div>`;out.onclick=()=>db.auth.signOut();const draw=()=>{const s=q.value.toLowerCase(),pf=f.value;g.innerHTML=industries.filter(x=>(!pf||x.folder===pf)&&(!s||`${x.name} ${x.code} ${x.folder||''}`.toLowerCase().includes(s))).map(x=>`<div class="card industry" data-c="${esc(x.code)}"><span class="pill">${esc(x.folder||'Sem pasta')}</span> <span class="pill rv">Peso RV ${esc(x.rv_weight)}</span><h3>${esc(x.name)}</h3><span class="muted">Código ${esc(x.code)}</span></div>`).join('');document.querySelectorAll('.industry').forEach(el=>el.onclick=()=>openIndustry(el.dataset.c))};q.oninput=draw;f.onchange=draw;draw()}async function openIndustry(code){const ind=industries.find(x=>String(x.code)===String(code));app.innerHTML=top()+`<div class="wrap"><button id="back" class="btn sec">← Indústrias</button><p>Carregando ${esc(ind.name)}…</p></div>`;out.onclick=()=>db.auth.signOut();back.onclick=home;const[{data:r},{data:fa},{data:pr}]=await Promise.all([db.from('positivity_rules').select('*').eq('industry_code',code).eq('active',true).order('start_date',{ascending:false}).limit(1).maybeSingle(),db.from('families').select('*').eq('industry_code',code).eq('active',true),db.from('products').select('*').eq('industry_code',code).eq('active',true).order('description')]);let rf=[];if(r){const{data}=await db.from('rule_families').select('*').eq('rule_id',r.id).eq('participates',true).order('display_order');rf=data||[]}const fam=(fa||[]).filter(x=>!rf.length||rf.some(y=>y.family_id===x.id)).sort((a,b)=>(rf.find(x=>x.family_id===a.id)?.display_order??999)-(rf.find(x=>x.family_id===b.id)?.display_order??999));let ack=false;if(r){const{data}=await db.from('rule_acknowledgements').select('acknowledged_at').eq('user_id',session.user.id).eq('rule_id',r.id).maybeSingle();ack=!!data}app.innerHTML=top()+`<div class="wrap"><button id="back" class="btn sec">← Indústrias</button><div class="hero" style="margin-top:12px"><span class="pill">${esc(ind.folder||'Sem pasta')}</span><h2>${esc(ind.name)}</h2><p>Código ${esc(ind.code)} · Peso na RV ${esc(ind.rv_weight)} · ${fam.length} famílias · ${(pr||[]).length} itens</p></div>${r?`<div class="rule"><h3>${esc(r.name)}</h3><p>${esc(r.seller_text)}</p><div><span class="pill">${esc(r.rule_type)}</span> <span class="pill rv">Mínimo ${esc(r.minimum_families)} famílias</span></div><button id="ack" class="btn" style="margin-top:10px" ${ack?'disabled':''}>${ack?'✓ Ciência registrada':'Li e estou ciente'}</button></div>`:''}<div id="fs">${fam.map(x=>{const ps=(pr||[]).filter(p=>p.family_id===x.id),rr=rf.find(z=>z.family_id===x.id);return`<div class="card family"><div class="family-head" data-id="${x.id}"><div><b>${esc(x.name)}</b> <span class="muted">(${ps.length} itens)</span>${rr?.required?' <span class="pill rv">Obrigatória</span>':''}</div><span>▼</span></div><div id="p-${x.id}" class="products hidden">${ps.map(p=>`<div class="product"><b>${esc(p.description)}</b><div class="muted">DAC ${esc(p.dac_code)} · EAN ${esc(p.ean)}</div></div>`).join('')}</div></div>`}).join('')}</div></div>`;out.onclick=()=>db.auth.signOut();back.onclick=home;document.querySelectorAll('.family-head').forEach(h=>h.onclick=()=>{const b=document.getElementById('p-'+h.dataset.id);b.classList.toggle('hidden');h.lastElementChild.textContent=b.classList.contains('hidden')?'▼':'▲'});document.getElementById('ack')?.addEventListener('click',async()=>{const{error}=await db.from('rule_acknowledgements').insert({user_id:session.user.id,rule_id:r.id});if(!error)openIndustry(code)})}const{data:{session:s}}=await db.auth.getSession();session=s;db.auth.onAuthStateChange((_e,s2)=>{session=s2;s2?boot():login()});session?boot():login();</script></body></html>
